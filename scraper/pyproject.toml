[project]
name = "uoft-scraper"
version = "0.4.0"
description = "Scrapes the UofT Timetable Builder public API into a class + room dataset"
requires-python = ">=3.10,<3.14"
dependencies = []

[project.scripts]
uoft-scraper = "uoft_scraper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uoft_scraper"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "live: hits the real UofT API (deselect with '-m \"not live\"')",
]
